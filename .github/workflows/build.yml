# build.yml — imágenes Docker → GHCR + deploy QA (enc-29d7943d, prop-60ea3410=B)
#
# En cada push a main/dev (tras pasar CI): construye las DOS imágenes y las
# publica en GHCR con tag `web-<sha7>` / `api-<sha7>` (+ rama). El deploy por
# compose usa siempre un tag exacto; la promoción pre→prod reutiliza la MISMA
# imagen (promote.yml) y el rollback es el tag anterior.
#
# Deploy a la VM (opcional hasta configurar secrets): vars.DEPLOY_QA_HOST +
# secrets.DEPLOY_QA_SSH_KEY. La VM despacha con deploy/deploy.sh --tag.
name: build

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # github.repository = agegr/pi-web
  IMAGE: ${{ github.repository }}

jobs:
  images:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          sha7="${GITHUB_SHA::7}"
          branch="${GITHUB_REF_NAME}"
          echo "sha7=$sha7" >> "$GITHUB_OUTPUT"
          echo "web_tags=${{ env.REGISTRY }}/${{ env.IMAGE }}:web-sha-$sha7,${{ env.REGISTRY }}/${{ env.IMAGE }}:web-$branch" >> "$GITHUB_OUTPUT"
          echo "api_tags=${{ env.REGISTRY }}/${{ env.IMAGE }}:api-sha-$sha7,${{ env.REGISTRY }}/${{ env.IMAGE }}:api-$branch" >> "$GITHUB_OUTPUT"

      - name: Build & push web image (full app standalone; runner extrae de aquí)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web_tags }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build & push api image (stateless proxy)
        uses: docker/build-push-action@v6
        with:
          context: deploy/api-proxy
          push: true
          tags: ${{ steps.tags.outputs.api_tags }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy-qa:
    needs: [images]
    # Sin VM configurada (vars.DEPLOY_QA_HOST) el job se salta: sólo imágenes.
    if: ${{ needs.images.result == 'success' && vars.DEPLOY_QA_HOST != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: qa
    steps:
      - name: Compute short sha
        id: sha
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH (deploy.sh all --tag)
        uses: appleboy/ssh-action@v1
        env:
          SHA7: ${{ steps.sha.outputs.sha7 }}
          GITSHA: ${{ github.sha }}
        with:
          host: ${{ vars.DEPLOY_QA_HOST }}
          username: ${{ vars.DEPLOY_QA_USER || 'rgsaura' }}
          key: ${{ secrets.DEPLOY_QA_SSH_KEY }}
          envs: SHA7,GITSHA
          script: |
            set -e
            cd ~/workspaces/exohuman/qa-deploy
            git fetch --all -q
            git checkout -q "$GITSHA"
            ./deploy/deploy.sh all --tag sha-"$SHA7"
